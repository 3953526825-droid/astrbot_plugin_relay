<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>传话任务</title>
  <style>
    :root{--bg:#f5f7fb;--card:#fff;--text:#162033;--muted:#718096;--line:#e7ebf3;--accent:#6557e8;--accent2:#8d7cff;--danger:#df5265;--shadow:0 18px 50px #27315d12}
    [data-theme="dark"]{--bg:#111522;--card:#1a2030;--text:#edf2ff;--muted:#9aa6bf;--line:#2b344a;--shadow:0 18px 50px #0004}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#dedbff66,transparent 32%),var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{max-width:1180px;margin:auto;padding:34px 28px 54px}.hero{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin-bottom:28px}.eyebrow{color:var(--accent);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:11px}.title{font-size:34px;line-height:1.15;margin:8px 0}.subtitle{color:var(--muted);margin:0}.actions{display:flex;gap:10px;align-items:center}.btn{border-radius:12px;padding:10px 15px;background:var(--card);color:var(--text);box-shadow:0 5px 18px #24325b0b;border:1px solid var(--line)}.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;border:0}.btn.danger{color:var(--danger)}.btn.small{padding:7px 10px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}.stat,.panel,.job{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:20px}.stat{padding:18px 20px}.stat b{display:block;font-size:28px}.stat span{color:var(--muted);font-size:12px}.layout{display:grid;grid-template-columns:340px 1fr;gap:18px}.panel{padding:21px}.panel h2{font-size:16px;margin:0 0 17px}.field{margin:12px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:11px;padding:10px 11px;outline:none}.field textarea{min-height:96px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hint{font-size:11px;color:var(--muted);margin-top:10px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.search{max-width:260px;width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:11px;padding:10px 12px}.jobs{display:grid;gap:12px}.job{padding:17px 18px;box-shadow:none}.jobtop{display:flex;justify-content:space-between;gap:14px}.jobname{font-weight:750;font-size:15px}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 8px;font-size:11px;margin-left:7px;background:#eceaff;color:var(--accent)}[data-theme="dark"] .badge{background:#342f62;color:#bcb4ff}.jobmeta{color:var(--muted);font-size:12px;margin-top:7px}.jobcontent{margin:13px 0;padding:11px 12px;border-radius:10px;background:var(--bg);white-space:pre-wrap;word-break:break-word}.jobfoot{display:flex;justify-content:space-between;gap:12px;align-items:center;color:var(--muted);font-size:12px}.jobbuttons{display:flex;gap:7px;flex-wrap:wrap}.toggle{width:43px;height:24px;border-radius:99px;background:#aab4c8;position:relative;vertical-align:middle;transition:.2s}.toggle:after{content:"";position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:3px;left:3px;transition:.2s;box-shadow:0 2px 5px #0003}.toggle.on{background:var(--accent)}.toggle.on:after{left:22px}.empty{text-align:center;padding:55px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:16px}.toast{position:fixed;right:24px;bottom:24px;background:#20283a;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}.loading{opacity:.55;pointer-events:none}@media(max-width:850px){.app{padding:24px 15px 40px}.hero{display:block}.actions{margin-top:16px}.layout{grid-template-columns:1fr}.stats{gap:9px}.stat{padding:14px}.stat b{font-size:23px}.toolbar{align-items:stretch;flex-direction:column}.search{max-width:none}}
  </style>
</head>
<body>
<div class="app" id="app">
  <header class="hero"><div><div class="eyebrow">AstrBot Relay System</div><h1 class="title">传话任务</h1><p class="subtitle">固定消息、每日提醒和周期传话。看得见，也能直接控制。</p></div><div class="actions"><button class="btn" id="refresh">↻ 刷新</button></div></header>
  <section class="stats"><div class="stat"><b id="total">—</b><span>全部任务</span></div><div class="stat"><b id="active">—</b><span>正在启用</span></div><div class="stat"><b id="paused">—</b><span>已停用</span></div></section>
  <div class="layout">
    <section class="panel"><h2>创建每日任务</h2><form id="createForm">
      <div class="field"><label>发送目标</label><input name="target_id" required placeholder="QQ号、群号或已配置别名" /></div>
      <div class="field"><label>目标类型</label><select name="target_type"><option value="private">私聊</option><option value="group">群聊</option></select></div>
      <div class="row"><div class="field"><label>小时</label><input name="daily_hour" type="number" min="0" max="23" value="9" required /></div><div class="field"><label>分钟</label><input name="daily_minute" type="number" min="0" max="59" value="0" required /></div></div>
      <div class="field"><label>每周规则</label><select name="day_of_week"><option value="-1">每天</option><option value="0">每周一</option><option value="1">每周二</option><option value="2">每周三</option><option value="3">每周四</option><option value="4">每周五</option><option value="5">每周六</option><option value="6">每周日</option></select></div>
      <div class="field"><label>发送内容</label><textarea name="content" required placeholder="到时间直接发送的固定内容"></textarea></div>
      <button class="btn primary" style="width:100%" type="submit">＋ 创建任务</button><div class="hint">任务会进入 AstrBot 原生 Basic Cron，可在本页或 AstrBot 未来任务页面管理。</div>
    </form></section>
    <section class="panel"><div class="toolbar"><h2 style="margin:0">任务列表</h2><input id="search" class="search" placeholder="搜索目标或内容" /></div><div id="jobs" class="jobs"><div class="empty">正在加载……</div></div></section>
  </div>
</div><div id="toast" class="toast"></div>
<script type="module">
const bridge=window.AstrBotPluginPage; await bridge.ready();
const $=s=>document.querySelector(s), jobsEl=$("#jobs"); let jobs=[];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
function toast(text){const e=$("#toast");e.textContent=text;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2600)}
function fmt(v){if(!v)return"—";return new Date(v).toLocaleString("zh-CN",{hour12:false})}
function rule(j){const p=j.expression.split(/\s+/);if(p.length<5)return j.expression;const day=p[4]==="*"?"每天":({mon:"周一",tue:"周二",wed:"周三",thu:"周四",fri:"周五",sat:"周六",sun:"周日"}[p[4]]||p[4]);return `${day} ${p[1].padStart(2,"0")}:${p[0].padStart(2,"0")}`}
function render(){const q=$("#search").value.trim().toLowerCase();const shown=jobs.filter(j=>(j.name+j.content+j.target_id).toLowerCase().includes(q));$("#total").textContent=jobs.length;$("#active").textContent=jobs.filter(j=>j.enabled).length;$("#paused").textContent=jobs.filter(j=>!j.enabled).length;if(!shown.length){jobsEl.innerHTML='<div class="empty">没有找到传话任务。<br>……这下是真的空了。</div>';return}jobsEl.innerHTML=shown.map(j=>`<article class="job"><div class="jobtop"><div><div class="jobname">${esc(j.name)}<span class="badge">${j.enabled?"启用":"停用"}</span></div><div class="jobmeta">${esc(rule(j))}　·　${esc(j.target_type==="group"?"群聊":"私聊")} ${esc(j.target_id)}　·　下次 ${esc(fmt(j.next_run))}</div></div><button class="toggle ${j.enabled?"on":""}" title="${j.enabled?"停用":"启用"}" data-toggle="${esc(j.id)}"></button></div><div class="jobcontent">${esc(j.content)}</div><div class="jobfoot"><span>上次执行：${esc(fmt(j.last_run))}${j.last_error?`　<span style="color:var(--danger)">异常：${esc(j.last_error)}</span>`:""}</span><div class="jobbuttons"><button class="btn small" data-run="${esc(j.id)}">立即测试</button><button class="btn small danger" data-delete="${esc(j.id)}">删除</button></div></div></article>`).join("")}
async function load(){document.body.classList.add("loading");try{const r=await bridge.apiGet("jobs");jobs=r.jobs||[]}catch(e){toast("加载失败："+e.message);jobs=[]}finally{document.body.classList.remove("loading");render()}}
$("#refresh").onclick=load;$("#search").oninput=render;
$("#createForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target), body=Object.fromEntries(f.entries());for(const k of ["daily_hour","daily_minute","day_of_week"])body[k]=Number(body[k]);try{const r=await bridge.apiPost("jobs/create",body);toast(r.message||"创建成功");e.target.reset();await load()}catch(err){toast("创建失败："+err.message)}};
jobsEl.onclick=async e=>{const t=e.target.closest("[data-toggle],[data-run],[data-delete]");if(!t)return;const id=t.dataset.toggle||t.dataset.run||t.dataset.delete;try{if(t.dataset.toggle)await bridge.apiPost("jobs/toggle",{job_id:id,enabled:!jobs.find(j=>j.id===id)?.enabled});else if(t.dataset.run){if(!confirm("立即向目标发送一次这条消息？"))return;await bridge.apiPost("jobs/run",{job_id:id});toast("已执行测试发送")}else{if(!confirm("确定删除这个任务？"))return;await bridge.apiPost("jobs/delete",{job_id:id});toast("任务已删除")}await load()}catch(err){toast("操作失败："+err.message)}};
function theme(){document.documentElement.dataset.theme=bridge.getContext()?.isDark?"dark":"light"}theme();bridge.onContext(theme);load();
</script></body></html>
